[project]
name = "konsent"
version = "0.1.0"
description = "A virtual camera that keeps you blurred until you lean in and look at it."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Md Altaf Hussain" }]

# These versions are interlocked — read before bumping.
#
# mediapipe 1.0.x crashes on macOS arm64: the face_landmarker graph forces
# TensorsToDetectionsCalculator through Metal and aborts with
# "Check failed: service_ Service is unavailable", even with delegate=CPU.
# 0.10.21 is the last release that initialises the GL context correctly.
#
# mediapipe 0.10.x pins numpy<2, which in turn rules out opencv-python 5.x.
dependencies = [
    "mediapipe==0.10.21",
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "pyvirtualcam==0.15.0",
    "pynput==1.8.2",
    # Tray icon on Linux/Windows; also used to render the icon art everywhere.
    "pystray>=0.19.5",
    "pillow>=10.0",
    # Menu bar app is macOS-only; the CLI works everywhere.
    "rumps==0.4.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-avfoundation>=10.0 ; sys_platform == 'darwin'",
]

[project.scripts]
konsent = "konsent.__main__:main"
konsent-app = "konsent.app:main"
konsent-setup = "konsent.doctor:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# The sources live in src/ but install as the `konsent` package: a top-level
# module literally named `src` would collide with every other project shipping
# one, and `python -m src` is not a usable entry point. Setuptools is used
# rather than hatchling because hatchling refuses editable installs when a
# sources rewrite changes a prefix instead of stripping it.
[tool.setuptools]
package-dir = {"konsent" = "src"}
packages = ["konsent", "konsent.sinks", "konsent.tray"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
